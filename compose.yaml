services:
  db:
    image: postgres:18
    container_name: scuolachill-db
    environment:
      POSTGRES_USER: scuolachill
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: scuolachill
    ports:
      - "5432:5432"
    volumes:
      - scuolachill-data:/var/lib/postgresql
    secrets:
      - db_password

  pgadmin:
    image: dpage/pgadmin4
    container_name: scuolachill-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@scuolachill.it
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    secrets:
      - pgadmin_password

volumes:
  scuolachill-data:
  pgadmin-data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  pgadmin_password:
    file: ./secrets/pgadmin_password.txt
